version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    ports:
      # 宿主 3306 已被本地 MySQL 占用，这里映射到 3307
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  redis:
    image: redis:7
    container_name: seckill-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  rmqnamesrv:
    image: apache/rocketmq:5.1.4
    container_name: seckill-namesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rmqbroker:
    image: apache/rocketmq:5.1.4
    container_name: seckill-broker
    restart: unless-stopped
    depends_on:
      - rmqnamesrv
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    # 用挂载的 broker.conf 覆盖默认配置（brokerIP1 必须是宿主机局域网 IP，
    # 这样宿主机上的 Spring Boot 应用才能连上 broker）
    command: sh mqbroker -n rmqnamesrv:9876 -c /home/rocketmq/rocketmq-5.1.4/conf/broker.conf
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.4/conf/broker.conf:ro

volumes:
  mysql-data:
  redis-data:
