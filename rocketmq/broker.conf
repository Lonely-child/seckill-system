# RocketMQ broker 单机开发配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：必须填宿主机局域网 IP（宿主机上的 Spring Boot 应用靠这个 IP 连 broker）
brokerIP1 = 10.27.197.107

# 开发环境自动创建 Topic（生产环境应改为手动创建并关闭此开关）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
